name: Supabase keep-alive

# Free-tier Supabase pauses after ~7 days without Postgres activity.
# A scheduled REST read resets the inactivity window (see Supabase docs).

on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Query barbershops (PostgREST → Postgres)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          code="$(curl -sS -o /tmp/supabase-keepalive.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/barbershops?select=id&limit=1")"
          echo "HTTP ${code}"
          cat /tmp/supabase-keepalive.json
          if [ "$code" != "200" ]; then
            echo "Keep-alive failed (project paused or RLS/network). Resume in Supabase Dashboard."
            exit 1
          fi
